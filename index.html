<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rozwój sieci kolejowej południowej Polski — wersja MapTiler</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>   <!-- for the vector-rendered custom basemap -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: rgba(244, 233, 209, 0.95);
    --ink:#3a2c1a;            /* dark sepia ink       */
    --ink-soft:#6c5a41;       /* muted brown          */
    --ink-faint:#8a775c;      /* faint brown          */
    --accent:#8a3b28;         /* oxblood / brick red  */
    --brass:#9a6b2f;          /* aged brass           */
    --edge: rgba(90,70,48,.35);
    --panel-bg: var(--parchment);
    --map-bg:#e6dcc6;         /* warm paper           */
  }
  html,body { margin:0; height:100%; color:var(--ink);
    font-family:"EB Garamond", Georgia, "Times New Roman", serif; }
  #map { position:absolute; inset:0; background:var(--map-bg); }

  /* caption / info panel — parchment card */
  #panel {
    position:absolute; right:24px; top:36px; z-index:1000; width:min(430px, 40vw);
    max-height:74vh; overflow:auto;
    background:var(--panel-bg); color:var(--ink);
    border:1px solid var(--edge); border-radius:6px; padding:20px 24px;
    box-shadow:0 10px 34px rgba(40,28,14,.45);
    transition:transform .55s ease;   /* slides from center to the top-right */
  }
  /* opening slide: box centered over the map; transform keeps it animatable */
  #panel.centered { transform:translate(calc(-50vw + 50% + 24px), calc(50vh - 50% - 36px)); }
  #panel .step { font-size:11px; color:var(--ink-faint); font-weight:600;
    text-transform:uppercase; letter-spacing:2.5px; }
  #panel .year { font-family:"Playfair Display", Georgia, serif; font-size:46px;
    font-weight:800; line-height:1; letter-spacing:-1px; color:var(--accent); margin-top:3px; }
  #panel .title { font-family:"Playfair Display", Georgia, serif; font-size:23px;
    font-weight:700; margin:12px 0 2px; line-height:1.2; color:var(--ink); }
  #panel .subtitle { font-size:15px; color:var(--ink-soft); font-style:italic; margin-bottom:4px; }
  #panel .body { font-size:16px; color:#4a3a26; margin-top:8px; line-height:1.5; }
  #panel .body p { margin:6px 0; }
  #panel ul.segs { list-style:none; padding:0; margin:14px 0 0; }
  #panel ul.segs li { font-size:15px; color:#4a3a26; padding:6px 0;
    border-top:1px solid rgba(90,70,48,.2); display:flex; gap:8px; align-items:baseline; }
  #panel ul.segs li .dot { flex:0 0 10px; width:10px; height:10px; border-radius:50%;
    margin-top:5px; border:1px solid rgba(0,0,0,.18); }
  #panel ul.segs li .ep { flex:1; }
  #panel ul.segs li .dt { color:var(--ink-faint); font-variant-numeric:tabular-nums; white-space:nowrap; }
  #panel ul.segs li .tag { font-size:10px; font-weight:700; color:#f4e9d1; background:var(--brass);
    padding:1px 6px; border-radius:3px; text-transform:uppercase; letter-spacing:.5px; }

  /* controls */
  #nav { position:absolute; right:24px; bottom:24px; z-index:1400; display:flex; gap:8px; align-items:center; }
  #nav button {
    font-size:15px; font-weight:600; color:var(--ink); background:var(--parchment);
    border:1px solid var(--edge); border-radius:6px; padding:10px 16px; cursor:pointer;
  }
  #nav button:hover { background:var(--accent); border-color:var(--accent); color:#f4e9d1; }
  /* prev/next buttons: touch devices only (desktop uses the arrow keys), stacked above the counter */
  #nav .navbtns { display:none; gap:8px; }
  @media (hover:none) and (pointer:coarse){
    #nav { flex-direction:column; align-items:stretch; right:16px; bottom:16px; }
    #nav .navbtns { display:flex; }
    #nav .navbtns button { flex:1; min-width:56px; min-height:48px; font-size:20px; padding:0;
      box-shadow:0 6px 20px rgba(40,28,14,.35); }
    #counter { text-align:center; }
  }
  #counter { color:var(--ink); background:var(--parchment); border:1px solid var(--edge);
    border-radius:6px; padding:10px 14px; font-variant-numeric:tabular-nums; font-size:15px;
    box-shadow:0 6px 20px rgba(40,28,14,.35); }

  /* intro / title overlay — cover slide from the source deck (data/cover.jpg) */
  #intro { position:absolute; inset:0; z-index:1500; display:flex; flex-direction:column;
           align-items:center; justify-content:center; text-align:center; color:#f4e9d1;
           background:linear-gradient(rgba(26,17,9,.52), rgba(18,11,5,.80)),
                      url("data/cover.jpg") center/cover no-repeat; }
  #intro h1 { font-family:"Playfair Display", Georgia, serif; font-size:54px; font-weight:800;
    margin:0 0 8px; letter-spacing:0; max-width:900px; line-height:1.12; color:#f6ecd7;
    text-shadow:0 3px 20px rgba(0,0,0,.75); }
  #intro h1::after { content:""; display:block; width:140px; height:2px; margin:20px auto 0;
    background:var(--brass); }
  #intro p  { font-size:19px; color:#e7d7b6; max-width:640px; margin:14px 24px 6px; line-height:1.55;
    text-shadow:0 2px 12px rgba(0,0,0,.7); }
  #intro .byline { font-size:21px; color:#f2e5c8; margin-top:22px; font-family:"EB Garamond",Georgia,serif; }
  #intro .ver { font-size:15px; color:#d8c39c; margin-top:4px; letter-spacing:.5px; }
  #intro .hint { margin-top:28px; font-size:15px; color:#e2d1ab; font-style:italic;
    text-shadow:0 2px 12px rgba(0,0,0,.7); }
  .hidden { display:none !important; }

  /* full-screen content slides (after the map) — no map behind them */
  #content { position:absolute; inset:0; z-index:1200; overflow:hidden;
    background:linear-gradient(160deg, #f4e9d1 0%, #ecdfc0 100%); color:var(--ink); }
  #content .sheet { width:min(1320px, 94vw); height:100%; margin:0 auto; padding:4vh 44px;
    box-sizing:border-box; display:flex; flex-direction:column; }
  #content h2 { font-family:"Playfair Display", Georgia, serif; font-size:36px; font-weight:800;
    color:var(--accent); margin:0; line-height:1.12; flex:0 0 auto; }
  #content h2::after { content:""; display:block; width:120px; height:2px; margin:14px 0 0; background:var(--brass); }
  /* body: images beside text so nothing runs past the viewport (no scrolling) */
  #content .cbody { flex:1 1 auto; min-height:0; margin-top:22px;
    display:flex; gap:40px; align-items:stretch; justify-content:center; }
  #content .imgs { flex:3 1 0; min-width:0; max-height:100%;
    display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; }
  #content .imgs:empty { display:none; }
  #content .imgs img { flex:0 1 auto; min-height:0; max-width:100%; max-height:100%; object-fit:contain;
    border:1px solid var(--edge); border-radius:4px; box-shadow:0 8px 26px rgba(40,28,14,.35); background:#fbf6ea; }
  #content ul.pts { flex:2 1 0; min-width:0; max-width:620px; max-height:100%; overflow:auto;
    list-style:none; padding:0; margin:0; align-self:center; }
  #content ul.pts li { font-size:19px; line-height:1.5; color:#4a3a26; padding:9px 0 9px 26px;
    position:relative; border-top:1px solid rgba(90,70,48,.16); }
  #content ul.pts li:first-child { border-top:none; }
  #content ul.pts li::before { content:"—"; position:absolute; left:0; color:var(--accent); font-weight:700; }
  #content ul.pts li a { color:#6b4a2a; word-break:break-all; }
  #content .cbody.only-imgs .imgs { flex:1 1 100%; }   /* image-only: use full width */
  #content .cbody.only-text ul.pts { max-width:780px; }  /* text-only: center the prose */
  /* map-left: the map image on the left, the photos stacked on the right */
  #content .cbody.map-left .imgs { flex-direction:row; align-items:stretch; gap:28px; }
  #content .cbody.map-left .map-col { flex:0 1 auto; min-width:0; min-height:0;
    display:flex; align-items:center; justify-content:center; }
  #content .cbody.map-left .map-col img { max-height:100%; max-width:100%; width:auto; }
  #content .cbody.map-left .photo-col { flex:1 1 0; min-width:0; min-height:0;
    display:flex; flex-direction:column; gap:16px; align-items:center; justify-content:center; }
  #content .cbody.map-left .photo-col img { max-height:calc(50% - 8px); max-width:100%; }
  #content .footnote { flex:0 0 auto; margin:14px 0 0; padding-top:12px; border-top:1px solid rgba(90,70,48,.16);
    font-size:13px; line-height:1.4; color:#7a6748; font-style:italic; }
  #content .footnote:empty { display:none; }
  #content .footnote a { color:#6b4a2a; word-break:break-all; }
  @media (max-width:820px){          /* narrow screens: stack and allow scroll as a fallback */
    #content { overflow:auto; }
    #content .sheet { height:auto; min-height:100%; }
    #content .cbody { flex-direction:column; align-items:stretch; }
  }
  /* full-screen photo step (PDF gallery photos, navigated with ← / →) */
  #photo { position:fixed; inset:0; z-index:1300; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 40%, #241811, #140c07); }
  #photo img { max-width:94vw; max-height:92vh; object-fit:contain;
    border:1px solid rgba(154,107,47,.5); box-shadow:0 12px 50px rgba(0,0,0,.6); background:#140c07; }
  #photo #ph-cap { position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    font-family:"Playfair Display",Georgia,serif; font-size:15px; letter-spacing:.5px; color:#e9d8b6;
    background:rgba(20,12,7,.6); border:1px solid rgba(154,107,47,.4); border-radius:20px; padding:5px 16px; }
  .leaflet-container { background:var(--map-bg); font-family:"EB Garamond", Georgia, serif; }
</style>
</head>
<body>
<div id="map"></div>


<div id="intro">
  <h1>Koleje w Karpatach</h1>
  <p class="byline">Rafał Górzanowski (881)</p>
  <p class="ver">v2.0, 24.09.2026</p>
  <div style="display:flex; gap:8px; margin-top:22px;">
    <button id="startBtn" style="font-family:'Playfair Display',Georgia,serif;font-size:17px;font-weight:700;letter-spacing:.5px;color:#f4e9d1;background:var(--accent);border:1px solid rgba(0,0,0,.2);border-radius:6px;padding:12px 26px;cursor:pointer;box-shadow:0 6px 20px rgba(20,12,6,.5);">▶</button>
  </div>
</div>

<div id="panel" class="hidden">
  <div class="year" id="p-year"></div>
  <div class="title" id="p-title"></div>
  <div class="subtitle" id="p-subtitle"></div>
  <div class="body" id="p-body"></div>
  <ul class="segs" id="p-segs"></ul>
</div>

<div id="content" class="hidden">
  <div class="sheet">
    <h2 id="c-title"></h2>
    <div class="cbody" id="c-body">
      <div class="imgs" id="c-imgs"></div>
      <ul class="pts" id="c-pts"></ul>
    </div>
    <p class="footnote" id="c-note"></p>
  </div>
</div>

<div id="photo" class="hidden"><img id="ph-img" src="" alt=""><div id="ph-cap"></div></div>

<div id="nav" class="hidden">
  <div class="navbtns">
    <button id="prevBtn" aria-label="Poprzedni slajd">◀</button>
    <button id="nextBtn" aria-label="Następny slajd">▶</button>
  </div>
  <span id="counter"></span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- MapLibre GL + Leaflet bridge: used only to render the custom vector basemap
     ("rail_background"), which the free MapTiler plan doesn't serve as raster. -->
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script src="data/slides.js"></script>
<script src="data/content_slides.js"></script>
<script src="data/gallery.js"></script>
<script src="data/borders_1914.js"></script>
<script src="data/borders_1930.js"></script>
<script>
// ---- config ----
// single line color (age-based coloring dropped)
function eraColor(y){
  return "#8a3b28";                   // oxblood / brick red, for every line
}
function gaugeDash(g, routed){
  if(g==="rack")     return "2 6";
  if(g==="electric") return "11 4 2 4";
  return null;                              // standard & narrow: solid (narrow set apart by color)
}
function segDash(seg, weight){
  // dismantled: round dots only — gap scales with the line weight so thick,
  // highlighted lines stay clearly dotted instead of merging into a solid line.
  if(seg.dismantled)   return "1 " + Math.round((weight||3) * 3.2);
  if(seg.construction) return "10 8";       // long dash: linia w budowie
  return gaugeDash(seg.gauge, seg.routed);
}
const CONSTRUCTION_COLOR = "#2b6cb0";       // blue: distinct from the historical oxblood
const NARROW_COLOR = "#1f7a4d";             // green: narrow gauge (wąskotorowe) — shown by color, not dashes
function segColor(seg){
  if(seg.construction) return CONSTRUCTION_COLOR;
  if(seg.gauge==="narrow") return NARROW_COLOR;
  return eraColor(segYear(seg));
}
function segYear(s){ return s.year || (s.date ? +s.date.slice(0,4) : null); }
function fmtDate(s){
  if(s.date){ const [y,m,d]=s.date.split("-"); return `${d}.${m}.${y}`; }
  if(s.year_end) return `${s.year}–${s.year_end}`;
  return `${s.year||"?"}`;
}
const GAUGE_LABEL = {narrow:"wąskotor.", rack:"zębata", electric:"elektr."};

// fitBounds padding that keeps the caption box (top-right) clear: reserve the
// screen strip from the panel's real left edge to the map's right edge, so
// fitted content — the whole frame (hence all of Slovakia) and the step's
// highlighted line — never lands behind the box. We MEASURE the rendered panel
// (its CSS width plus padding/border) instead of estimating it, so the reserved
// strip matches the box exactly even when the map zooms out on eastern slides.
function panelPad(m){
  m = m || 24;
  const gap = 14;
  try {
    const mapRect = map.getContainer().getBoundingClientRect();
    // use the panel's RESTING layout position (offsetLeft ignores any transform),
    // so the reserved strip is correct even while the box is animating from center
    const restLeft = panel.offsetLeft, w = panel.offsetWidth;
    if(w > 0 && !panel.classList.contains('hidden')){
      return { paddingTopLeft: [m, m],
               paddingBottomRight: [Math.max(0, mapRect.right - restLeft) + gap, m] };
    }
  } catch(e){}
  // fallback (panel not yet laid out, e.g. behind the intro)
  const panelW = Math.min(430, window.innerWidth * 0.4) + 48;
  return { paddingTopLeft: [m, m], paddingBottomRight: [panelW + 24 + gap, m] };
}

// ---- MapTiler basemap ----
// Get a free key at https://cloud.maptiler.com/account/keys/ and paste it below.
const MAPTILER_KEY   = "y86wLMW1Pne4XUKPilqT";
// Selectable raster styles (the muted/gray ones keep the colored rail lines readable);
// the switcher dropdown (added below) lets you preview any of these live.
const MAPTILER_STYLES = [
  ["dataviz",        "Dataviz (jasnoszary)"],
  ["dataviz-dark",   "Dataviz ciemny"],
  ["backdrop",       "Backdrop (stonowany)"],
  ["toner-v2",       "Toner (czarno-biały)"],
  ["basic-v2-light", "Basic jasny"],
  ["bright-v2",      "Bright (kolorowy)"],
  ["streets-v2",     "Streets"],
  ["01a0d3aa-923f-722d-9c9e-a568da95720a", "Outdoor (bez szlaków)", "vector"],   // custom "rail_background" style (Outdoor, trails hidden); free plan serves it only as vector → rendered via MapLibre GL
  ["topo-v2",        "Topo"],
  ["winter-v2",      "Winter"],
  ["openstreetmap",  "OpenStreetMap"],
  ["satellite",      "Satelita"],
  ["hybrid",         "Hybryda (satelita + opisy)"],
];
let MAPTILER_STYLE = "01a0d3aa-923f-722d-9c9e-a568da95720a";   // default: Outdoor (bez szlaków)
const maptilerUrl = s => `https://api.maptiler.com/maps/${s}/{z}/{x}/{y}.png?key=${MAPTILER_KEY}`;
// fixed presentation frame: Gliwice (NW) — Верхнє Висоцьке (SE).
// Shown on every slide; lines may extend beyond it. The Kolej Transwersalna
// slide temporarily zooms out to reveal the whole network, then we snap back.
const FRAME = L.latLngBounds([[48.945, 18.662], [50.301, 23.047]]);
// wide view for the two opening slides (railway origins across Europe); the deck
// then zooms from here into the southern-Poland FRAME on the first Galician line.
const EUROPE = L.latLngBounds([[36.0, -11.0], [59.5, 32.0]]);
// zoomSnap:0 lets fitBounds land on a fractional zoom so the frame fills the
// screen exactly, instead of snapping to the next whole zoom (too wide / too tight).
const map = L.map('map', {zoomControl:false, attributionControl:true, zoomSnap:0, zoomDelta:0.5, wheelPxPerZoomLevel:120}).setView([49.4, 20.8], 7);
const baseLayer = L.tileLayer(maptilerUrl(MAPTILER_STYLE), {
  attribution:'&copy; <a href="https://www.maptiler.com/copyright/">MapTiler</a> &copy; OpenStreetMap contributors · line data © OpenStreetMap',
  maxZoom:20, maxNativeZoom:20, tileSize:512, zoomOffset:-1
});   // added by applyStyle() below when a raster style is selected

// Basemap style switcher (MapTiler version only). Sits below the content/photo
// overlays (z-index 1200/1300) so it only shows over the map, and swaps the
// tile URL in place with setUrl.
(function(){
  // Most styles are pre-rendered raster (swapped on the shared `baseLayer` with
  // setUrl). Entries flagged "vector" (the custom "rail_background" style) aren't
  // available as raster on the free plan, so they're drawn with MapLibre GL from
  // the style.json, in the tilePane so they sit below the rail lines and borders.
  const isVector = id => (MAPTILER_STYLES.find(s => s[0] === id) || [])[2] === "vector";
  const styleJsonUrl = id => `https://api.maptiler.com/maps/${id}/style.json?key=${MAPTILER_KEY}`;
  let glLayer = null;

  function applyStyle(id){
    MAPTILER_STYLE = id;
    if(isVector(id)){
      if(map.hasLayer(baseLayer)) map.removeLayer(baseLayer);
      if(glLayer && glLayer._styleId !== id){ map.removeLayer(glLayer); glLayer = null; }
      if(!glLayer){
        glLayer = L.maplibreGL({ pane:'tilePane', style: styleJsonUrl(id),
          attribution:'&copy; <a href="https://www.maptiler.com/copyright/">MapTiler</a> &copy; OpenStreetMap contributors · line data © OpenStreetMap' });
        glLayer._styleId = id;
      }
      if(!map.hasLayer(glLayer)) glLayer.addTo(map);
    } else {
      if(glLayer && map.hasLayer(glLayer)) map.removeLayer(glLayer);
      if(!map.hasLayer(baseLayer)) baseLayer.addTo(map);
      baseLayer.setUrl(maptilerUrl(id));
    }
  }

  const sel = document.createElement('select');
  sel.id = 'basemap-picker';
  sel.title = 'Podkład mapy (MapTiler)';
  sel.style.cssText = 'position:absolute; top:12px; left:12px; z-index:1150; ' +
    'font:13px/1.2 system-ui,-apple-system,sans-serif; padding:6px 26px 6px 9px; ' +
    'border:1px solid rgba(0,0,0,.25); border-radius:6px; background:rgba(255,255,255,.92); ' +
    'color:#222; box-shadow:0 2px 8px rgba(0,0,0,.25); cursor:pointer;';
  MAPTILER_STYLES.forEach(([v,label])=>{
    const o = document.createElement('option');
    o.value = v; o.textContent = label; if(v===MAPTILER_STYLE) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener('change', ()=> applyStyle(sel.value));
  document.body.appendChild(sel);
  applyStyle(MAPTILER_STYLE);
})();

// Historical state borders, drawn in a dedicated pane below the railway lines and
// swapped per slide (see slideEraFor / showBorders):
//   1914 — Austria-Hungary / German Empire / Russian Empire (meeting at the Three
//          Emperors' Corner near Mysłowice), shown up to and including WWI;
//   1930 — Poland / German Reich / Czechoslovakia, shown for the interwar slides.
// Post-1939 slides show none (the modern basemap already carries today's borders).
map.createPane('borders');
map.getPane('borders').style.zIndex = 350;       // above tiles (200), below rail lines (400)
function makeBorderLayer(data){
  if(!data) return null;
  const bopt = { renderer:L.svg({pane:'borders'}), interactive:false };
  const g = L.layerGroup();
  L.geoJSON(data, {...bopt,                        // light casing for legibility
    style:{ color:'#f4e9d1', weight:6, opacity:0.55, lineCap:'round', lineJoin:'round' } }).addTo(g);
  L.geoJSON(data, {...bopt,                        // the border itself
    style:{ color:'#5b2a86', weight:2.6, opacity:0.9, dashArray:'9 7', lineCap:'round', lineJoin:'round' } }).addTo(g);
  return g;
}
const BORDER_LAYERS = { 1914: makeBorderLayer(window.BORDERS_1914),
                        1930: makeBorderLayer(window.BORDERS_1930) };
if(window.BORDERS_1914 || window.BORDERS_1930)
  map.attributionControl.addAttribution('historical borders © <a href="https://www.openhistoricalmap.org">OpenHistoricalMap</a> (ODbL)');
function showBorders(era){
  Object.entries(BORDER_LAYERS).forEach(([e, g]) => {
    if(!g) return;
    const want = (+e === era);
    if(want && !map.hasLayer(g)) g.addTo(map);
    else if(!want && map.hasLayer(g)) map.removeLayer(g);
  });
}

// First two ODP slides shown as map slides over a Europe-wide view, before the
// map zooms into southern Poland on the first Galician line (1847).
const MAP_INTRO = [
  { title:"Pierwsze linie kolejowe", europe:true, segments:[], body:[
    "• Pierwsze wykorzystanie szyn na świecie: droga przez Przesmyk Koryncki ~VII w. p. Chr.",
    "• Konny transport szynowy w kopalniach",
    "• Wynalazek silnika parowego 1794",
    "• Na świecie: linia Stockton – Darlington-on-Tees 1825",
    "• W monarchii austro-węgierskiej: lata 30 XIX w. – koleje konne, m. in. Czeskie Budejowice - Linz",
    "• 6.01.1838 – Floridsdorf - Deutsch Wagram",
    "• Na współczesnych ziemiach polskich: 22.05.1842 Wrocław – Oława",
    "• W Galicji: 13.10.1847 Mysłowice – Kraków Główny",
  ]},
];
const SLIDES = MAP_INTRO.concat(window.SLIDES || []);
const CONTENT = window.CONTENT_SLIDES || [];   // plain slides after the map
const GALLERY = window.GALLERY || [];          // extra PDF photos per content slide

// Which historical border era each slide shows: 1914 borders up to and including
// WWI, interwar (1930) borders between the wars, none afterwards. Dated slides go
// by their newest line's year; the undated divider slides (WWI / WWII / post-war /
// contemporary) are decided by their title, and any other undated slide inherits
// the previous slide's era.
function slideEraFor(sl, prev){
  const s = (sl.title||"") + " " + (sl.subtitle||"");
  if(/II\s+wojn|drugiej\s+wojn/i.test(s)) return 0;        // WWII → modern basemap borders
  if(/powojenn|współczesn/i.test(s))      return 0;        // post-war / contemporary
  if(/I\s+wojn|pierwszej\s+wojn/i.test(s)) return 1914;    // WWI (inclusive)
  const ys = (sl.segments||[]).map(segYear).filter(Boolean);
  if(!ys.length) return prev;
  const y = Math.max(...ys);
  return y <= 1918 ? 1914 : (y <= 1939 ? 1930 : 0);
}
const SLIDE_ERA = (()=>{ let p = 1914; return SLIDES.map(sl => (p = slideEraFor(sl, p))); })();

// Flat navigation: every map slide is one step; every content slide is one step
// immediately followed by one step per PDF photo, so → walks the line's photos
// full-screen (no scrolling) before advancing to the next line.
const STEPS = [];
for(let i=0;i<SLIDES.length;i++) STEPS.push({type:'map', i});
for(let c=0;c<CONTENT.length;c++){
  STEPS.push({type:'content', c});
  (GALLERY[c]||[]).forEach((_, p) => STEPS.push({type:'photo', c, p}));
}
const TOTAL = STEPS.length;

// Dismantled lines are drawn as dots in their own pane ABOVE the rail lines. A
// dismantled stretch usually lies on top of an earlier solid line (the route was
// built, then later torn up), so once the tear-up slide is reached we HIDE that
// fragment of the earlier line — swapping the solid polyline for its remaining
// ends — leaving only the dots on the map, with no solid line under them.
map.createPane('dismantled');
map.getPane('dismantled').style.zIndex = 460;    // above rail lines (overlayPane 400)

const _seg2ll = seg => (seg.coords||[]).map(c => [c[0], c[1]]);
// one polyline per segment: dismantled → dots (in the pane above), others → normal
const slideSegs = SLIDES.map(sl => (sl.segments||[]).map(seg => {
  const latlngs = _seg2ll(seg);
  const base = { lineJoin:"round", lineCap:"round", _seg:seg };
  const poly = seg.dismantled
    ? L.polyline(latlngs, {...base, pane:'dismantled', _role:'dots',
        color:segColor(seg), weight:3.5, opacity:0.95, dashArray:segDash(seg,3.5) })
    : L.polyline(latlngs, {...base, _role:'normal',
        color:segColor(seg), weight:3, opacity:0.9, dashArray:segDash(seg,3) });
  return { seg, latlngs, poly };
}));

// Match each dismantled fragment to the earlier solid line it sits on, anchoring
// the cut on the fragment's endpoints, and record which span of that line to hide
// from the tear-up slide onward (its remaining ends stay solid).
(function linkDismantled(){
  const TOLD = 0.0004, d2 = (a,b)=>{ const dx=a[0]-b[0], dy=a[1]-b[1]; return dx*dx+dy*dy; };
  const nearPt = (a,b)=> Math.abs(a[0]-b[0])<TOLD && Math.abs(a[1]-b[1])<TOLD;
  const nearestIdx = (p,c)=>{ let bi=0,bd=Infinity; for(let i=0;i<c.length;i++){ const dd=d2(p,c[i]); if(dd<bd){bd=dd;bi=i;} } return bi; };
  SLIDES.forEach((sl,dk)=> (sl.segments||[]).forEach(seg=>{
    if(!seg.dismantled) return;
    const dc = _seg2ll(seg);
    let parent=null, bf=0.9;                        // parent = solid line carrying ≥90% of the fragment
    slideSegs.forEach(segs => segs.forEach(o=>{
      if(o.seg.dismantled) return;
      const f = dc.filter(p=>o.latlngs.some(q=>nearPt(p,q))).length / (dc.length||1);
      if(f>bf){ bf=f; parent=o; }
    }));
    if(!parent) return;
    const pc = parent.latlngs; let mn=Infinity, mx=-1;
    dc.forEach(p=>{ const bi=nearestIdx(p,pc); if(bi<mn)mn=bi; if(bi>mx)mx=bi; });
    if(mn<=2) mn=0; if(mx>=pc.length-3) mx=pc.length-1;   // snap to ends to avoid stubs
    const pieces=[];
    if(mn>0) pieces.push(pc.slice(0,mn+1));
    if(mx<pc.length-1) pieces.push(pc.slice(mx));
    const o=parent.poly.options;
    o._full = pc; o._rem = pieces;
    o._remAt = (o._remAt==null) ? dk : Math.min(o._remAt, dk);
  }));
})();

// flat array of polyline layers per slide, index-aligned with SLIDES
const slideLayers = slideSegs.map(segs => segs.map(o => o.poly));

let idx = -1; // -1 = intro
const panel = document.getElementById('panel');
const nav = document.getElementById('nav');
const content = document.getElementById('content');

function linkify(t){
  const esc = t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  return esc
    .replace(/(https?:\/\/[^\s~]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/~([^~]+)~/g, '<s>$1</s>');   // ~text~ = strikethrough (e.g. closed/removed services)
}
const photo = document.getElementById('photo');
function showPhoto(src, n, total){
  document.getElementById('ph-img').src = src;
  document.getElementById('ph-cap').textContent = total > 1 ? `${n} / ${total}` : "";
  photo.classList.remove('hidden');
}

function showContent(c){
  document.getElementById('c-title').textContent = c.title || "";
  const imgs = c.images||[];
  const mapLeft = c.layout === "map-left" && imgs.length > 1;
  document.getElementById('c-imgs').innerHTML = mapLeft
    ? `<div class="map-col"><img src="${imgs[0]}" alt=""></div>` +
      `<div class="photo-col">` + imgs.slice(1).map(src => `<img src="${src}" alt="">`).join("") + `</div>`
    : imgs.map(src => `<img src="${src}" alt="">`).join("");
  const pts = document.getElementById('c-pts');
  pts.innerHTML = (c.bullets||[]).map(b => `<li>${linkify(b)}</li>`).join("");
  const hasImgs = imgs.length > 0;
  const hasText = (c.bullets||[]).length > 0;
  pts.style.display = hasText ? "" : "none";
  const body = document.getElementById('c-body');
  body.classList.toggle('only-imgs', hasImgs && !hasText);
  body.classList.toggle('only-text', hasText && !hasImgs);
  body.classList.toggle('map-left', mapLeft);
  document.getElementById('c-note').innerHTML = c.footnote ? linkify(c.footnote) : "";
  content.scrollTop = 0;
}

function styleUpTo(i){
  slideLayers.forEach((layers, k) => {
    const isNew = (k === i);
    layers.forEach(lyr => {
      if(k > i){ if(map.hasLayer(lyr)) map.removeLayer(lyr); return; }
      if(!map.hasLayer(lyr)) lyr.addTo(map);
      const seg = lyr.options._seg, role = lyr.options._role, o = lyr.options;
      if(role === 'dots'){
        // dismantled dots: prominent on every slide, always above the rail lines
        const w = isNew ? 6 : 4;
        lyr.setStyle({ color:segColor(seg), weight:w, opacity:0.95, dashArray:segDash(seg, w) });
        lyr.bringToFront();
        return;
      }
      // normal line: once its dismantled fragment's slide is reached, show only the
      // remaining ends, so the torn-up middle isn't drawn solid under the dots
      if(o._rem){ const rem = (i >= o._remAt); if(lyr._remOn !== rem){ lyr.setLatLngs(rem ? o._rem : o._full); lyr._remOn = rem; } }
      const weight = isNew ? 5.5 : 2.6;
      lyr.setStyle({
        color: segColor(seg),
        weight,
        opacity: isNew ? 1 : (seg.routed ? 0.72 : 0.5),
        dashArray: segDash(seg, weight),
      });
      if(isNew) lyr.bringToFront();
    });
  });
}

function stepYears(sl){
  const ys = sl.segments.map(segYear).filter(Boolean);
  if(!ys.length) return "";
  const a = Math.min(...ys), b = Math.max(...ys);
  return a === b ? `${a}` : `${a}–${b}`;
}

function showPanel(sl){
  document.getElementById('p-year').textContent = stepYears(sl);
  document.getElementById('p-title').textContent = sl.title || "";
  const sub = document.getElementById('p-subtitle');
  sub.textContent = sl.subtitle || ""; sub.style.display = sl.subtitle ? "" : "none";
  const body = document.getElementById('p-body');
  body.innerHTML = (sl.body||[]).map(t => `<p>${t}</p>`).join("");
  const ul = document.getElementById('p-segs');
  ul.innerHTML = sl.segments.map(seg => {
    const col = segColor(seg);
    const tag = seg.gauge!=="standard" ? `<span class="tag">${GAUGE_LABEL[seg.gauge]||seg.gauge}</span>` : "";
    const dis = !seg.routed ? `<span class="tag" style="background:#6c5a41;color:#f4e9d1">nieistniejąca</span>` : "";
    const rem = seg.dismantled ? `<span class="tag" style="background:#6c5a41;color:#f4e9d1">rozebrana</span>` : "";
    const con = seg.construction ? `<span class="tag" style="background:${CONSTRUCTION_COLOR};color:#eaf2fb">w budowie</span>` : "";
    return `<li><span class="dot" style="background:${col}"></span>`+
           `<span class="ep">${seg.from} – ${seg.to} ${tag} ${dis} ${rem} ${con}</span>`+
           `<span class="dt">${fmtDate(seg)}</span></li>`;
  }).join("");
}

function render(){
  if(idx<0){ return; }
  document.getElementById('counter').textContent = `${idx+1} / ${TOTAL}`;
  const step = STEPS[idx];
  // gallery photo: full-screen single image, no map/sheet behind
  if(step.type === 'photo'){
    const ph = GALLERY[step.c] || [];
    panel.classList.add('hidden');
    content.classList.add('hidden');
    showPhoto(ph[step.p], step.p + 1, ph.length);
    return;
  }
  photo.classList.add('hidden');
  // content slides (after the map): show a full-screen sheet, no map behind
  if(step.type === 'content'){
    panel.classList.add('hidden');
    content.classList.remove('hidden');
    showContent(CONTENT[step.c]);
    return;
  }
  // map slide
  const i = step.i;
  content.classList.add('hidden');
  panel.classList.remove('hidden');
  panel.classList.toggle('centered', !!SLIDES[i].europe);   // centered on the opening slide only
  styleUpTo(i);
  showBorders(SLIDE_ERA[i]);                                 // 1914 / 1930 / none per era
  showPanel(SLIDES[i]);
  // viewport: hold the fixed frame on every slide, EXCEPT the Kolej
  // Transwersalna slide, which zooms out to reveal every line drawn so far.
  // The following slide snaps straight back to the frame.
  const isTransversal = /Transwersalna/i.test(SLIDES[i].title || "");
  if(SLIDES[i].europe){
    // opening slide: box is centered, so fit the whole Europe view symmetrically;
    // the next slide zooms into southern Poland as the box slides to the right
    map.fitBounds(EUROPE, {padding:[40,40], animate:true});
  } else if(isTransversal){
    const shown = [];
    for(let k=0;k<=i;k++) shown.push(...slideLayers[k]);
    if(shown.length){
      try { map.fitBounds(L.featureGroup(shown).getBounds(), {...panelPad(40), animate:true}); }
      catch(e){}
    }
  } else {
    // hold the fixed frame, but always include this step's highlighted lines, and
    // reserve the panel's screen strip, so the highlight is never behind the box.
    let b = L.latLngBounds(FRAME.getSouthWest(), FRAME.getNorthEast());
    (slideLayers[i]||[]).forEach(lyr => { try { b.extend(lyr.getBounds()); } catch(e){} });
    map.fitBounds(b, {...panelPad(), animate:true});
  }
}

function go(i){
  const wasIntro = idx<0;
  idx = Math.max(0, Math.min(TOTAL-1, i));
  if(wasIntro){
    document.getElementById('intro').classList.add('hidden');
    nav.classList.remove('hidden');
  }
  render();
}
function next(){ if(idx<0){ go(0); } else if(idx<TOTAL-1){ go(idx+1); } }
function prev(){ if(idx>0){ go(idx-1); } else if(idx===0){ go(TOTAL-1); } }   // wrap: left on first slide -> last

document.getElementById('startBtn').onclick = ()=>go(0);
document.getElementById('prevBtn').onclick = prev;
document.getElementById('nextBtn').onclick = next;
document.addEventListener('keydown', e=>{
  if(e.key==="ArrowRight"||e.key===" "){ e.preventDefault(); next(); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); prev(); }
  else if(e.key==="f"||e.key==="F"){ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
});

// show the opening Europe-wide view behind the intro (first slide starts here)
try { map.fitBounds(EUROPE, panelPad()); } catch(e){}
</script>
</body>
</html>
